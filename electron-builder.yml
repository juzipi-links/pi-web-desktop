appId: com.agegr.piweb.desktop
productName: Pi Web Desktop
copyright: Copyright © 2025 agegr
directories:
  output: release
  buildResources: build

npmRebuild: false
nodeGypRebuild: false

files:
  - dist/**/*
  - assets/**/*
  - src/renderer/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/@agegr/pi-web/.next/cache/**/*"
  - "!node_modules/@agegr/pi-web/.next/dev/**/*"
  - "!node_modules/@agegr/pi-web/.next/**/*.js.map"
  - "!node_modules/*/**/*.md"
  - "!node_modules/*/**/*.ts"
  - "!node_modules/*/**/*.map"

# Native modules and next server need to be unpacked on Windows
asar: true
asarUnpack:
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/@agegr/pi-web/**/*"
  - "**/node_modules/next/**/*"

extraResources:
  - from: assets
    to: assets
  - from: src/renderer
    to: renderer

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  legalTrademarks: Pi Web Desktop
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Pi Web Desktop
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish: null
